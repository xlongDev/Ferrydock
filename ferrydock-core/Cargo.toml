[package]
name = "ferrydock-core"
version = "0.1.0"
edition = "2021"
description = "Multi-provider OpenAI-compatible proxy engine with failover, built for WorkBuddy."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
futures-util = "0.3"
rand = "0.8"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
base64 = "0.22"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
